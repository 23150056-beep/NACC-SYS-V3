# NACC SYS V3 — Render blueprint.
#
# Deploy: push this repo to GitHub, then Render → New → Blueprint → pick the
# repo. Render creates the database, the API service and the web frontend from
# this file. Secrets marked `sync: false` are typed into the dashboard once and
# never live in git.
#
# After the first deploy, set RUN_SEED=false on the API service (the seed is
# idempotent, but there is no reason to run it on every boot).
#
# ⚠️  The services here are on Render's FREE plan: they sleep after ~15 minutes
# idle, so the first request after a quiet period takes ~30 seconds while the
# container wakes. Fine for building and demoing. To upgrade, change
# `plan: free` to `plan: starter` on the API service.
#
# THE DATABASE IS NOT DECLARED IN THIS FILE. It lives on Neon
# (ap-southeast-1), outside Render, because Render's free PostgreSQL instance
# is DELETED 30 days after it is created — data and all. Declaring it here
# again would be worse than useless: a blueprint re-sync would rebind
# DATABASE_URL to a Render-managed database and silently send writes somewhere
# other than the live one. See docs/CLOUD-DEPLOYMENT.md §2.

services:
  # ---- Django API ------------------------------------------------------
  - type: web
    name: nacc-v3-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore 
    healthCheckPath: /healthz/
    envVars:
      # Paste the Neon connection string in the dashboard once. Use the DIRECT
      # endpoint — a hostname containing `-pooler` routes through pgbouncer in
      # transaction mode, which breaks Django's migrations.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRE
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true    # Render mints a strong key on first deploy
      - key: DJANGO_DEBUG
        value: "False"
      # Render injects RENDER_EXTERNAL_HOSTNAME at runtime, and settings.py
      # appends it to ALLOWED_HOSTS/CSRF_TRUSTED_ORIGINS automatically — so
      # this only needs the custom domain, if there is one.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RUN_SEED
        value: "true"
      # 2 workers fits Render's 512 MB free instance; raise to 3-4 after
      # moving to a paid plan with more memory.
      - key: WEB_CONCURRENCY
        value: "2"

      # ---- Uploaded files (reports, consent scans, child photos) --------
      # ⚠️  USE_S3=false keeps uploads on the container's own disk, which
      # Render destroys on every deploy and every wake from sleep. Uploaded
      # reports and consent scans WILL be lost. That is acceptable only while
      # testing with sample data — never with real case files.
      #
      # To switch on object storage: set USE_S3=true here, then add these five
      # variables in the Render dashboard (any S3-compatible bucket works —
      # AWS S3, Cloudflare R2, Backblaze B2, Supabase Storage):
      #   AWS_STORAGE_BUCKET_NAME   AWS_S3_REGION_NAME   AWS_S3_ENDPOINT_URL
      #   AWS_ACCESS_KEY_ID         AWS_SECRET_ACCESS_KEY
      # Keep the bucket PRIVATE — the app serves files only through
      # authenticated endpoints, never from a public URL.
      - key: USE_S3
        value: "false"

      # ---- Google Sign-In (optional; staff and psychologists only) -------
      # Leave unset to deploy with the password form only. When set, the
      # login page shows a Google button. Accounts are never auto-created —
      # an Administrator creates the user first. Admins always use passwords.
      # The Google Cloud OAuth client needs the frontend URL under
      # "Authorised JavaScript origins". See docs/CLOUD-DEPLOYMENT.md §10.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      # Optional: comma-separated agency domains, e.g. racco1.gov.ph
      - key: GOOGLE_ALLOWED_DOMAINS
        sync: false

      # ---- AI layer (optional; system is fully functional with it off) ---
      # Leave unset to deploy with AI disabled. Set the key, then switch the
      # provider to "Hosted" in Settings → AI Assistance.
      - key: AI_HOSTED_API_KEY
        sync: false

  # ---- React frontend (static site) ------------------------------------
  - type: web
    name: nacc-v3-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Baked into the bundle at build time. Set this to the API service's
      # public URL + /api once the API has deployed and has a hostname.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # React Router owns the URL space — every deep link has to resolve to
      # index.html or a page refresh on /children/12 returns 404.
      - type: rewrite
        source: /*
        destination: /index.html
