# NACC SYS V3 — Render blueprint.
#
# Deploy: push this repo to GitHub, then Render → New → Blueprint → pick the
# repo. Render creates the database, the API service and the web frontend from
# this file. Secrets marked `sync: false` are typed into the dashboard once and
# never live in git.
#
# After the first deploy, set RUN_SEED=false on the API service (the seed is
# idempotent, but there is no reason to run it on every boot).

databases:
  - name: nacc-v3-db
    databaseName: nacc_v3
    user: nacc
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  # ---- Django API ------------------------------------------------------
  - type: web
    name: nacc-v3-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: singapore          # closest region to RACCO I (Philippines)
    healthCheckPath: /healthz/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nacc-v3-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true    # Render mints a strong key on first deploy
      - key: DJANGO_DEBUG
        value: "False"
      # Render injects RENDER_EXTERNAL_HOSTNAME at runtime, and settings.py
      # appends it to ALLOWED_HOSTS/CSRF_TRUSTED_ORIGINS automatically — so
      # this only needs the custom domain, if there is one.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: nacc-v3-web
          type: web
          property: host
      - key: RUN_SEED
        value: "true"
      - key: WEB_CONCURRENCY
        value: "3"

      # ---- Uploaded files (reports, consent scans, child photos) --------
      # Render's disk is ephemeral: without S3 every upload is destroyed on
      # the next deploy. Point these at any S3-compatible bucket and keep the
      # bucket PRIVATE — the app serves files only through authenticated
      # endpoints.
      - key: USE_S3
        value: "true"
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false            # blank for AWS S3; set for R2/B2/Supabase
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # ---- AI layer (optional; system is fully functional with it off) ---
      # Leave unset to deploy with AI disabled. Set the key, then switch the
      # provider to "Hosted" in Settings → AI Assistance.
      - key: AI_HOSTED_API_KEY
        sync: false

  # ---- React frontend (static site) ------------------------------------
  - type: web
    name: nacc-v3-web
    runtime: static
    region: singapore
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Baked into the bundle at build time. Set this to the API service's
      # public URL + /api once the API has deployed and has a hostname.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # React Router owns the URL space — every deep link has to resolve to
      # index.html or a page refresh on /children/12 returns 404.
      - type: rewrite
        source: /*
        destination: /index.html
