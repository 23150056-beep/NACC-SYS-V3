# NACC SYS V3 — Render blueprint for the DEMO deployment.
#
# This file lives in NACC-SYS-V3.1-LOCAL-VER and creates services named
# nacc-v3-demo-*. The LIVE services (nacc-v3-api, nacc-v3-web) are created from
# a different repository and are not affected by anything here.
#
# The names differ deliberately. Render service names are unique per workspace,
# so reusing the live names would collide with production.
#
# Deploy: Render → New → Blueprint → pick NACC-SYS-V3.1-LOCAL-VER. Secrets
# marked `sync: false` are typed into the dashboard once and never live in git.
#
# DATABASE_URL MUST BE A NEON BRANCH connection string, never main. The branch
# exists so the demo inherits the real user accounts while its writes — and the
# migrations in this repo that the live deployment does not have — never reach
# production. Use the DIRECT endpoint: a hostname containing `-pooler` routes
# through pgbouncer in transaction mode, which breaks Django's migrations.
#
# The R2 variables must point at an EMPTY demo bucket. No object is copied from
# the live bucket: the demo has no reports, consent scans or child photographs
# because it has none at all, not because they were filtered.
#
# After the first deploy, set RUN_SEED=false on the API service (the seed is
# idempotent, but there is no reason to run it on every boot).
#
# ⚠️  Render's FREE plan: services sleep after ~15 minutes idle, so the first
# request after a quiet period takes ~60 seconds while the container wakes.
# That is the plan, not a misconfiguration.

services:
  # ---- Django API ------------------------------------------------------
  - type: web
    name: nacc-v3-demo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /healthz/
    envVars:
      # Paste the Neon connection string in the dashboard once. Use the DIRECT
      # endpoint — a hostname containing `-pooler` routes through pgbouncer in
      # transaction mode, which breaks Django's migrations.
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRE
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true    # Render mints a strong key on first deploy
      - key: DJANGO_DEBUG
        value: "False"
      # Render injects RENDER_EXTERNAL_HOSTNAME at runtime, and settings.py
      # appends it to ALLOWED_HOSTS/CSRF_TRUSTED_ORIGINS automatically — so
      # this only needs the custom domain, if there is one.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RUN_SEED
        value: "true"
      # 2 workers fits Render's 512 MB free instance; raise to 3-4 after
      # moving to a paid plan with more memory.
      - key: WEB_CONCURRENCY
        value: "2"

      # ---- Uploaded files (reports, consent scans, child photos) --------
      # Uploads go to Cloudflare R2. With USE_S3=false they land on the
      # container's own disk, which Render destroys on every deploy AND every
      # wake from sleep — reports and consent scans vanish silently, which is
      # the worst way for a system holding child case files to lose them.
      #
      # These four are typed into the dashboard (docs §5a):
      #   AWS_STORAGE_BUCKET_NAME   AWS_S3_ENDPOINT_URL
      #   AWS_ACCESS_KEY_ID         AWS_SECRET_ACCESS_KEY
      # AWS_S3_REGION_NAME is optional and defaults to "auto", which is what
      # R2 wants.
      #
      # ⚠️  The R2 API token must be "Object Read & Write". "Object Read only"
      # authenticates perfectly and then fails every upload with AccessDenied,
      # which reads like a credential problem and is not one. The bucket's own
      # counters diagnose it in seconds: Class B operations climbing while
      # Class A stays at zero means reads work and writes are refused.
      #
      # Keep the bucket PRIVATE. The app serves files only through
      # authenticated endpoints that check permissions first, never from a
      # public URL — a readable bucket would put child case files one guessed
      # filename away from anyone.
      - key: USE_S3
        value: "true"
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # ---- Google Sign-In (optional; staff and psychologists only) -------
      # Leave unset to deploy with the password form only. When set, the
      # login page shows a Google button. Accounts are never auto-created —
      # an Administrator creates the user first. Admins always use passwords.
      # The Google Cloud OAuth client needs the frontend URL under
      # "Authorised JavaScript origins". See docs/CLOUD-DEPLOYMENT.md §10.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      # Optional: comma-separated agency domains, e.g. racco1.gov.ph
      - key: GOOGLE_ALLOWED_DOMAINS
        sync: false

      # ---- AI layer (optional; system is fully functional with it off) ---
      # Leave unset to deploy with AI disabled. Set the key, then switch the
  # ---- React frontend (static site) ------------------------------------
  - type: web
    name: nacc-v3-demo-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Baked into the bundle at build time. Set this to the API service's
      # public URL + /api once the API has deployed and has a hostname.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # React Router owns the URL space — every deep link has to resolve to
      # index.html or a page refresh on /children/12 returns 404.
      - type: rewrite
        source: /*
        destination: /index.html
